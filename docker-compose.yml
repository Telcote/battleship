name: battleship

services:
  db:
    image: postgres:17
    container_name: battleship-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ./service
      target: runtime
    container_name: battleship-app
    env_file: .env
    environment:
      POSTGRES_HOST: db
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  app2:
    build:
      context: ./service
      target: runtime
    container_name: battleship-app2
    env_file: .env
    environment:
      POSTGRES_HOST: db
    restart: unless-stopped
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  arena:
    build:
      context: ./arena
      target: runtime
    container_name: battleship-arena
    restart: unless-stopped
    ports:
      - "80:8100"
    depends_on:
      app:
        condition: service_started

  rogue:
    build:
      context: ./arena
      target: runtime
    container_name: battleship-rogue
    command: ["uvicorn", "rogue.main:app", "--host", "0.0.0.0", "--port", "8200"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "8200:8200"
    profiles:
      - rogue

  tests:
    build:
      context: ./service
      target: test
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - test

  arena-tests:
    build:
      context: ./arena
      target: test
    profiles:
      - test

volumes:
  postgres-data:
